name: Tests

on:
  pull_request:
    branches:
      - dev

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pgTAP + Deno + Shell
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: supabase/postgres:15.1.0.117
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: major_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/major_test

    steps:
      - uses: actions/checkout@v4

      # ── Deno ───────────────────────────────────────────────────────
      - name: Set up Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      # ── Node.js (shell tests) ───────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install shell dependencies
        run: npm install
        working-directory: shell

      # ── pgTAP ──────────────────────────────────────────────────────
      - name: Install pgTAP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libtap-parser-sourcehandler-pgtap-perl
          # Install pgTAP extension into the test database.
          psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS pgtap;"

      - name: Apply Major schema migrations
        run: |
          # Apply migrations in order so the schema is ready for pgTAP.
          for f in supabase/migrations/*.sql; do
            echo "Applying $f ..."
            psql "$DATABASE_URL" -f "$f" >/dev/null
          done

      # ── Run all three suites via npm test ──────────────────────────
      - name: Run test suites
        run: npm test
