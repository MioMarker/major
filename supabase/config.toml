# Edge function configuration.
#
# All major-* functions disable the Supabase platform gateway's JWT
# pre-check (`verify_jwt = false`). Reasons:
#
#   - The Shell authenticates via the new-format service-role secret
#     (`sb_secret_…`), which is NOT a JWT — it has no segments and the
#     gateway's pre-check rejects it with UNAUTHORIZED_INVALID_JWT_FORMAT
#     before our function ever runs.
#
#   - Authentication is enforced by `_shared/auth.ts` inside every
#     function: human callers go through `supabase.auth.getUser(token)`
#     (works with HS256/ES256), and Shell callers go through the
#     service-role bypass + X-Major-Shell-Id header. The gateway's
#     pre-check is redundant for both paths.
#
#   - major-github-webhook authenticates by HMAC-SHA256 signature
#     verification (X-Hub-Signature-256), not Supabase Auth.
#
#   - major-reaper is invoked by pg_cron and never carries a user JWT.
#
# Trade-off: bad actors can hit endpoints with bogus tokens and we have
# to validate inside the function instead of the gateway short-circuiting
# them. Acceptable for Major's low-traffic two-dev v1; revisit if
# unauthenticated load becomes a problem.

[functions.major-create-triage-session]
verify_jwt = false

[functions.major-send-triage-message]
verify_jwt = false

[functions.major-finalize-triage-session]
verify_jwt = false

[functions.major-apply-change-set]
verify_jwt = false

[functions.major-list-briefs]
verify_jwt = false

[functions.major-get-brief]
verify_jwt = false

[functions.major-claim-brief]
verify_jwt = false

[functions.major-finalize-run]
verify_jwt = false

[functions.major-heartbeat]
verify_jwt = false

[functions.major-confirm-qa]
verify_jwt = false

[functions.major-reject-brief]
verify_jwt = false

[functions.major-start-auto-triage]
verify_jwt = false

[functions.major-github-webhook]
verify_jwt = false

[functions.major-reaper]
verify_jwt = false
